:root{--radius-card:20px;--radius-control:13px;--space:16px}

function seasonFor(d=today()){let s=data.settings;if(!s.seasons)return '';let auto='';try{let [y,m,day]=d.split('-').map(Number),parts=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{month:'numeric',day:'numeric'}).formatToParts(new Date(y,m-1,day,12)),month=Number(parts.find(p=>p.type==='month')?.value),date=Number(parts.find(p=>p.type==='day')?.value);if(month===10&&date===1)auto='eidfitr';else if(month===12&&date===10)auto='eidadha';else if(month===9)auto='ramadan'}catch{}let yr=d.slice(0,4),customF=s.eidFitr?.startsWith(yr),customA=s.eidAdha?.startsWith(yr),customR=s.ramadanStart?.startsWith(yr)&&s.ramadanEnd;if(customF&&d===s.eidFitr||!customF&&auto==='eidfitr')return 'eidfitr';if(customA&&d===s.eidAdha||!customA&&auto==='eidadha')return 'eidadha';if(customR&&d>=s.ramadanStart&&d<=s.ramadanEnd||!customR&&auto==='ramadan')return 'ramadan';return ''}

let photoMode='';async function compress(file){let url=URL.createObjectURL(file);try{let im=await new Promise((res,rej)=>{let i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});let f=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*f));c.height=Math.max(1,Math.round(im.height*f));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.83)}finally{URL.revokeObjectURL(url)}}

$('#file').onchange=async e=>{let file=e.target.files[0];if(!file)return;let mode=photoMode;try{let photo=await compress(file);if(mode==='editcover'){draft.cover=photo;render();return}if(mode==='memory'){memoryDraft.photo=photo;render();return}toast(L('Reading the photo…','Foto wordt gelezen…'));let text='';if(mode==='barcode'&&'BarcodeDetector' in window){try{let im=await createImageBitmap(file),codes=await new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}).detect(im);text=codes[0]?.rawValue||'';im.close()}catch{}}if(!text&&mode==='barcode'){try{if(!window.ZXing)await new Promise((res,rej)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=res;s.onerror=rej;document.head.append(s)});let reader=new ZXing.BrowserMultiFormatReader();let im=new Image();im.src=photo;await im.decode();let r=await reader.decodeFromImageElement(im);text=r.getText()}catch{}}if(!text)try{text=await ocr(file)}catch{}if(mode==='quote'){if(text)quoteDraft.text=text;else toast(L('Text could not be recognized. Please type it.','Tekst niet herkend. Typ het citaat.'));render();return}if(mode==='barcode'){let isbn=text.replace(/[^0-9X]/gi,'').match(/(?:97[89]\d{10}|\d{9}[\dX])/i)?.[0];text=isbn||text}let q=mode==='barcode'?text:text.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,3).join(' ');q=q.slice(0,140);let confirmed=prompt(L('Confirm or correct the title / ISBN:','Controleer of verbeter titel / ISBN:'),q);if(confirmed?.trim()){let input=$('#search [name=q]');if(input)input.value=confirmed;await searchBooks(confirmed.trim())}else{draft=newBook();draft.cover=photo;go('edit')}}catch{toast(L('Photo could not be processed. Try another photo.','Foto kon niet worden verwerkt. Probeer een andere foto.'))}};
function validBackup(x){return x&&x.version===1&&Array.isArray(x.books)&&Array.isArray(x.sessions)&&Array.isArray(x.quotes)&&Array.isArray(x.collections)&&Array.isArray(x.authors)&&x.settings&&typeof x.settings==='object'&&x.books.every(b=>b&&typeof b.id==='string'&&/^[a-z0-9-]+$/i.test(b.id)&&typeof b.title==='string'&&typeof b.author==='string'&&Object.prototype.hasOwnProperty.call(statusLabels,b.status)&&Number.isFinite(Number(b.rating))&&(!b.memories||Array.isArray(b.memories)&&b.memories.every(m=>m&&typeof m.id==='string'&&/^[a-z0-9-]+$/i.test(m.id))))&&x.quotes.every(q=>q&&typeof q.id==='string'&&/^[a-z0-9-]+$/i.test(q.id)&&typeof q.text==='string')&&x.collections.every(c=>c&&typeof c.id==='string'&&/^[a-z0-9-]+$/i.test(c.id)&&typeof c.name==='string'&&Array.isArray(c.books)&&c.books.every(id=>typeof id==='string'&&/^[a-z0-9-]+$/i.test(id)))&&x.authors.every(a=>typeof a==='string')&&x.sessions.every(s=>s&&typeof s.date==='string')}
$('#restore').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let x=JSON.parse(await f.text());if(!validBackup(x))throw Error('invalid');if(!confirm(L('Replace your current library with this backup?','Huidige bibliotheek vervangen door deze back-up?')))return;data={...initial(),...x,settings:{...initial().settings,...x.settings},timer:null};await save();go('home');toast(t('Saved'))}catch{toast(L('Invalid backup file.','Ongeldig back-upbestand.'))}finally{e.target.value=''}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});window.addEventListener('pageshow',tick);
(async()=>{await load();route=data.settings.onboard?'home':'gift';render();timerTick=setInterval(tick,1000);if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
